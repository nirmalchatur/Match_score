<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#245F73" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="TailorUp — collect real job postings, parse them into structured requirements, and score them against your master resume."
    />

    <!--
      Per-page <title> and meta description are written at runtime by
      src/lib/seo.ts, because this is a client-rendered SPA: there is no
      server to render a different <head> per route. These are the defaults
      that apply before that runs, and are what a crawler sees for any route
      it does not execute JS for.
    -->
    <title>TailorUp · Job Matching &amp; Resume Analytics</title>

    <!-- Canonical and social. og:image must be a raster image: Facebook,
         LinkedIn and X do not render SVG for it. -->
    <link rel="canonical" href="https://match-score-delta.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TailorUp" />
    <meta property="og:title" content="TailorUp · Job Matching &amp; Resume Analytics" />
    <meta
      property="og:description"
      content="Open-source job analysis. Score your master resume against a real posting, see the skill gap, and tailor it. Runs locally with Ollama."
    />
    <meta property="og:url" content="https://match-score-delta.vercel.app/" />
    <meta property="og:image" content="https://match-score-delta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TailorUp — Know how well you fit before you apply." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TailorUp · Job Matching &amp; Resume Analytics" />
    <meta
      name="twitter:description"
      content="Open-source job analysis. Score your master resume against a real posting, see the skill gap, and tailor it."
    />
    <meta name="twitter:image" content="https://match-score-delta.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="TailorUp — Know how well you fit before you apply." />

    <!--
      Favicons. The PNG set and the .ico are generated by
      scripts/generate_brand_assets.py; the SVG is hand-maintained but uses
      the same geometry. Browsers pick the last valid one, so the modern PNGs
      come first and the legacy .ico last.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Typography
      ---------
      A deliberately monochrome system, served as woff2 from Google
      Fonts. The order below is the reverse of the original list
      because Archivo is now the display face, not Instrument Serif:
      a high-contrast serif on the wordmark and headlines is what made
      the product read as editorial/lifestyle rather than as a hiring
      tool. The serif is still loaded, but only for pull quotes and
      the footer.

        Archivo            400-700       -- wordmark, headlines, numerals
        Inter Tight        400-600       -- UI and body copy
        JetBrains Mono     400-500       -- labels, scores, data
        Instrument Serif   400 + italic  -- pull quotes, footer only

      The earlier "Wavehaus Sans" entries were removed: it is a commercial
      typeface that was never licensed into this repo, so every page load
      was firing four guaranteed 404s for /fonts/WavehausSans-*.woff2 before
      falling through to a fallback anyway.

      The stylesheet is loaded non-render-blocking and swapped in on load.
      Each stack ends in a real system face, so a blocked or offline CDN
      degrades cleanly instead of leaving text invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
      <!-- Applied before first paint so a dark-theme user never gets a white
         flash while React boots. Mirrors resolve() in hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tailorup.theme');
          var dark = stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
