<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TailorUp">
  <!--
    Brand favicon. Replaces a purple gradient bolt left over from a design tool,
    which was inconsistent with TailorUp's teal. Kept in step with the PNG set
    produced by scripts/generate_brand_assets.py -- the geometry is the same
    bolt on the same 24x24 viewBox as the in-app IconLogo.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245F73"/>
      <stop offset="100%" stop-color="#183E4C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <path fill="#F2F0EF" d="M36.3 5.3 12.8 35.2h13.6l-2.7 23.5 27.5-31.2H36.8l3.5-22.2z"/>
</svg>