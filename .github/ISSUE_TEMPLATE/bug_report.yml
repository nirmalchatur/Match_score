name: Bug report
description: Something in TailorUp is broken or behaves wrongly.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues should not go here.** See SECURITY.md for the private route.
        Please don't paste resumes, API keys, or other personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Paste a job link from …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Job analysis / match score
        - Resume upload or tailoring
        - Applications tracker / dashboard
        - Sign-in / account / settings
        - AI provider setup
        - Local development / CI
        - Other
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Deployed site, or local? Browser and OS if it's a UI bug.
      placeholder: Local, Chrome 140 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Browser console, network response, or Django traceback. Redact anything personal.
      render: text
