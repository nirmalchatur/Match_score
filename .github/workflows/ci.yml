name: CI

# Everything that protects `main` runs here. The trigger the project asked
# for is a merge, which reaches Actions as a push to main, so that is the
# primary event; pull_request is kept so a branch is verified *before* it
# can be merged rather than only after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to main is the authoritative record. Superseded runs are cancelled
# so a burst of pushes does not burn minutes, but a run already on main is
# never cancelled: its result is the one that gets reported.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. The only job needing more is the PR comment job,
# which opts into `pull-requests: write` for itself.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ---------------------------------------------------------------------
  # Django unit tests
  # ---------------------------------------------------------------------
  backend-tests:
    name: Django tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every failure rather than stopping at the first: a merge that
      # breaks auth *and* the match engine should show both, not one.
      fail-fast: false
      matrix:
        # Django 6.1 requires Python 3.12+. The old workflow pinned 3.7-3.9,
        # which cannot even install the project.
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The root requirements.txt is intentionally empty; the backend
          # file is the real dependency set. Caching the wrong one is a
          # silent no-op, so the path is explicit.
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # A model edited without running makemigrations passes every test
        # and then fails in production. This is the check that catches it.
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        # settings_test is the hermetic module: throwaway database, in-memory
        # mail, and DEBUG off so the production security block is exercised.
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          set -o pipefail
          python manage.py test --noinput --verbosity 2 2>&1 | tee test-output.txt

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: django-tests-py${{ matrix.python-version }}
          path: backend/test-output.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # System checks
  # ---------------------------------------------------------------------
  django-checks:
    name: Django checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configuration check
        run: python manage.py check

      - name: Deployment check
        # Runs against config.settings with production-like environment,
        # NOT settings_test. settings_test deliberately switches the
        # security flags off so Newman can talk plain HTTP to 127.0.0.1, so
        # checking *it* would only re-report the test overrides as warnings
        # -- exactly backwards. The env below mirrors render.yaml.
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DEBUG: 'false'
          SECRET_KEY: ci-deployment-check-only-not-a-real-secret-key-0000
          ALLOWED_HOSTS: onrender.com
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: |
          python - <<'PY'
          import os
          import django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()

          from django.conf import settings

          # The project has not wired an SMTP backend yet; settings.py
          # hardcodes the console backend. That is a real, known gap, and
          # mail.E001 says so every single run. Silence just that one ID so
          # the check stays honest about everything else -- the security.W*
          # warnings still fail the build if a setting regresses.
          settings.SILENCED_SYSTEM_CHECKS = list(settings.SILENCED_SYSTEM_CHECKS) + ["mail.E001"]

          from django.core.management import execute_from_command_line
          execute_from_command_line(["manage.py", "check", "--deploy"])
          PY

      - name: Collect static files
        # A missing static reference only shows up at collectstatic time on
        # Render, never in a test.
        run: python manage.py collectstatic --noinput

  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci, not npm install: it installs exactly the lockfile and
        # fails if package.json and the lockfile disagree.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # tsc runs as part of the build, so a type error fails the job
        # rather than shipping a broken bundle.
        #
        # VITE_API_URL is a placeholder. The build refuses to run without it
        # (see vite.config.ts), because a bundle with no API URL is a
        # production bug that only shows up as "Request failed (405)" in the
        # browser. CI is not a deployment, so any absolute URL will do; the
        # real value is injected by Vercel at deploy time.
        env:
          VITE_API_URL: https://api.example.invalid/api
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # Dependency audit
  # ---------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

  # ---------------------------------------------------------------------
  # Single aggregated gate
  # ---------------------------------------------------------------------
  # One job that depends on everything else. Branch protection can require
  # this one check, so "main is green" reduces to a single status instead
  # of a list that has to stay in sync.
  ci-status:
    name: CI status
    if: always()
    needs:
      - backend-tests
      - django-checks
      - frontend
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect results
        env:
          BACKEND_TESTS: ${{ join(needs.backend-tests.result, ',') }}
          DJANGO_CHECKS: ${{ needs.django-checks.result }}
          FRONTEND: ${{ needs.frontend.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          {
            echo "### CI status"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| Django tests | $BACKEND_TESTS |"
            echo "| Django checks | $DJANGO_CHECKS |"
            echo "| Frontend | $FRONTEND |"
            echo "| Dependency audit | $AUDIT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if anything failed
        env:
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          DJANGO_CHECKS: ${{ needs.django-checks.result }}
          FRONTEND: ${{ needs.frontend.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          # 'skipped' and 'cancelled' are deliberately NOT treated as
          # success. A cancelled required check must not let a merge
          # through, so anything other than 'success' fails the gate.
          status=0
          for result in "$BACKEND_TESTS" "$DJANGO_CHECKS" "$FRONTEND" "$AUDIT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'."
              status=1
            fi
          done
          exit $status

  # ---------------------------------------------------------------------
  # PR comment
  # ---------------------------------------------------------------------
  pr-comment:
    name: Comment on PR
    if: always() && github.event_name == 'pull_request'
    needs: [ci-status]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-status -->';
            const { owner, repo } = context.repo;
            const pr = context.issue.number;

            const sha = context.payload.pull_request.head.sha;
            const checks = (await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: sha }
            )).filter(c => c.name === 'CI status');

            const check = checks[checks.length - 1];
            const state = check ? (check.conclusion || check.status) : 'unknown';
            const icon = { success: '✅', failure: '❌', neutral: '🟡' }[state] || '⏳';
            const url = check
              ? check.html_url
              : context.payload.pull_request.html_url;

            const title = (context.payload.pull_request.title || '').slice(0, 80);
            const body = [
              marker,
              '### ' + icon + ' CI: ' + state,
              '',
              'Merging is blocked until this check is green.',
              '[' + title + '](' + url + ')',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body }
              );
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: pr, body }
              );
            }
