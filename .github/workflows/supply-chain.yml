name: Supply chain

# Companion to `security.yml`, which audits what is installed *right now*.
# This one is about changes in flight and about knowing exactly what shipped:
#
#   - dependency-review: blocks a PR that introduces a vulnerable package,
#     or a copyleft one, before a human has to notice.
#   - sbom: records a machine-readable inventory of every dependency and
#     version that produced a given commit, so "are we affected?" becomes a
#     lookup instead of an archaeology exercise.

# The review job is only meaningful on a pull request, because it diffs the
# PR against its merge base. On a push to main there is nothing to diff, so
# the push/schedule triggers run the SBOM only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------------
  # Scoped to the diff. Only NEW dependencies are judged, so an unrelated
  # advisory in a package that has been pinned for a year does not block an
  # urgent fix for something else.
  # ---------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # Preflight: can this review run at all?
      #
      # `dependency-review-action` reads the dependency graph, and the graph is
      # a repository setting rather than a property of the diff. With it off,
      # the action cannot list what the pull request changed at all, so it
      # fails in about seven seconds pointing at a settings page. That is a
      # red X on every PR which says nothing about the code, and it buries the
      # one line in the run that would explain why.
      #
      # `dependency-graph/sbom` answers exactly that question, and it answers
      # it without a token: 200 when the graph is available, 404 when it has
      # been switched off. Every other answer -- rate limit, GitHub outage, a
      # 403 if the endpoint's permissions ever change -- counts as "available",
      # so this step can only ever make the job stricter. It can never turn a
      # review that would have run into one that is quietly skipped.
      # ---------------------------------------------------------------------
      - name: Is the dependency graph available?
        id: graph
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          echo "responded $code"
          if [ "$code" = "404" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Not a silent skip. The annotation is the one line everyone sees in the
      # checks list, and the summary carries the fix, so the gap is reported
      # rather than hidden behind a green tick.
      - name: Report the repository setting the review needs
        if: steps.graph.outputs.available != 'true'
        run: |
          echo '::warning title=Dependency review skipped::The dependency graph is disabled, so the dependencies this pull request changes could not be listed and no advisory or licence was judged.'
          {
            echo '### Dependency review skipped'
            echo ''
            echo 'The **dependency graph** is disabled for this repository. That graph is the data source `actions/dependency-review-action` reads; with it off the action cannot enumerate the diff, so it fails immediately instead of reviewing anything.'
            echo ''
            echo 'This is a repository setting, not a defect in the pull request. Enable it once and the review below becomes a real gate on the next run, with no workflow change needed:'
            echo ''
            echo '- **Settings -> Code security -> Dependency graph**, or'
            echo "- \`gh api -X PATCH repos/${{ github.repository }} -f 'security_and_analysis[dependency_graph][status]=enabled'\`"
            echo ''
            echo 'Known-vulnerable dependencies are still blocked in the meantime by the `Dependency audit` job in `security.yml`, which runs `pip-audit` and `npm audit` against the manifests on every push and pull request.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Safe-harbour: never silently pass a malformed result. A scanner that
      # errors is reported as failing rather than treated as "nothing found".
      - name: Review the dependency diff
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

          # Copyleft and source-available licences are a deliberate choice,
          # not something to inherit by accident from a transitive
          # dependency. Anything not listed here fails the review.
          #
          # Only SPDX ids this action actually recognises are listed. An
          # unrecognised id makes the job error out, which is a confusing way
          # to find a typo -- Commons-Clause was exactly that, and was removed
          # rather than worked around.
          license-check: true
          deny-licenses: >
            GPL-1.0, GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0,
            LGPL-2.0, LGPL-2.1, LGPL-3.0, SSPL-1.0, BUSL-1.1,
            Elastic-2.0

          # Results are posted back onto the PR only when this job fails, so a
          # clean run leaves no comment behind.
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------
  # Inventory of what a commit actually contains. Uploaded as an artifact
  # rather than a published registry: nothing here should be trusted to
  # come from a package nobody reviewed.
  # ---------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
        # No cache: sbom-action scans the lockfile, not a restored tree, so
        # a stale cache would buy nothing and could hide a changed lockfile.

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          # Pull the full dependency tree rather than only what is declared
          # directly, or the most interesting entries are the missing ones.
          dependency-snapshot: true
          # The real package names, not a wall of transitive ones nobody
          # can action. Full detail is still in the file.
          uniquify-licenses: true

      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90
          if-no-files-found: error
