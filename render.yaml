# Render blueprint for the TailorUp Django API.
#
# Deploy with:  Render Dashboard > New > Blueprint > point at this repo
# The database is created and linked automatically; DATABASE_URL is injected.
#
# NOTE: uploaded resumes are written to MEDIA_ROOT. On the free tier the
# filesystem is ephemeral and files are lost on redeploy. Attach a persistent
# disk (see below) or move to object storage before going live.

services:
  - type: web
    name: tailorup-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/auth/me/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        # Render generates this ONCE and stores it, so it survives redeploys.
        #
        # It is load-bearing beyond sessions: user AI keys are encrypted with a
        # key derived from it (apps.users.crypto). Rotating it therefore makes
        # every stored API key undecryptable, and affected users must re-paste
        # theirs. That fails loudly and safely -- a key that cannot be decrypted
        # is deleted and reported as "not configured", never silently downgraded
        # to plaintext -- but it is still user-visible, so treat this as
        # effectively permanent once users have saved keys.
        generateValue: true
      - key: ALLOWED_HOSTS
        # Must be the exact hostname, not the bare domain. Django matches
        # ALLOWED_HOSTS literally, so "onrender.com" rejects
        # "tailorup-api.onrender.com" with DisallowedHost -> HTTP 400. That
        # made every request fail and left the health check unable to pass,
        # so Render reported the deploy as timed out.
        value: "tailorup-api.onrender.com"
      # The three origin variables must agree. They used to be mixed: this one
      # was prompted while the two below were hardcoded to a domain that never
      # existed, so a deploy could silently produce a CORS/CSRF pair that
      # rejected the real frontend. All three are now prompted at deploy time.
      - key: FRONTEND_ORIGIN
        # Your deployed Vercel origin, e.g. https://match-score.vercel.app
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Vercel previews live on a per-commit subdomain
      # (match-score-<hash>-<team>.vercel.app), so their origin cannot be
      # listed above and it changes on every push. This regex lets branch
      # previews reach the API; keep CORS_ALLOWED_ORIGINS for production.
      # Anchored to this project's own subdomain, so it is not a blanket allow.
      - key: CORS_ALLOWED_ORIGINS_REGEX
        value: 'https://match-score.*\.vercel\.app'
      # --- AI provider ---------------------------------------------------
      # Gemini, the hosted provider. A web host cannot run an Ollama daemon,
      # so this is what makes resume tailoring work in production.
      #
      # There is deliberately **no** GEMINI_API_KEY. Each user pastes their own
      # Google AI Studio key into Settings, and it is stored encrypted against
      # SECRET_KEY. That keeps the owner's quota off the owner's bill and means
      # a single leaked deployment cannot be used by anyone.
      - key: AI_PROVIDER
        value: "gemini"
      # Pinned to a model that is actually live. gemini-2.0-flash was shut down
      # by Google in June 2026 and answered 404 for every user's key.
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      # Generation timeout in seconds. Matches gunicorn's --timeout above, so a
      # slow tailoring call is answered with a real error rather than a worker
      # kill.
      - key: GEMINI_TIMEOUT
        value: "120"
    # Uncomment once on a paid plan to keep uploaded resumes across deploys.
    # disk:
    #   name: media
    #   mountPath: /opt/render/project/src/media
    #   sizeGB: 1

databases:
  - name: tailorup-db
    databaseName: tailorup
    user: tailorup
    plan: free
    postgresMajorVersion: "16"
